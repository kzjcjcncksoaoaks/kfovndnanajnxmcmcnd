<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Player</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ФОНОВЫЕ СЛОИ -->
  <div class="bg" aria-hidden="true">
    <div class="bg-blob blob-a"></div>
    <div class="bg-blob blob-b"></div>
    <div class="bg-blob blob-c"></div>
    <div class="bg-grain"></div>
    <div class="bg-vignette"></div>
  </div>

  <!-- ИСКРЫ-ЧАСТИЦЫ -->
  <div class="particles" id="particles" aria-hidden="true"></div>

  <!-- ГЛАВНАЯ КАРТОЧКА -->
  <main class="player" id="player">

    <!-- Обложка -->
    <div class="cover-stack">
      <div class="cover-glow" id="coverGlow"></div>
      <div class="cover-frame" id="coverFrame">
        <img class="cover" id="cover" alt="" draggable="false" />
        <div class="cover-shine"></div>
        <div class="cover-grain"></div>
      </div>
    </div>

    <!-- Инфа о треке -->
    <header class="track">
      <h1 class="track-title"  id="trackTitle">—</h1>
      <p  class="track-artist" id="trackArtist">—</p>
      <p  class="track-album"  id="trackAlbum">—</p>
    </header>

    <!-- Прогресс -->
    <section class="progress" aria-label="Прогресс">
      <div class="progress-track" id="progressTrack" role="slider"
           aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-fill" id="progressFill">
          <div class="progress-thumb" id="progressThumb"></div>
        </div>
      </div>
      <div class="progress-times">
        <span id="timeCurrent">0:00</span>
        <span id="timeDuration">0:00</span>
      </div>
    </section>

    <!-- Визуализайзер -->
    <canvas class="viz" id="viz" width="600" height="90"></canvas>

    <!-- Основные кнопки -->
    <nav class="controls" aria-label="Управление">
      <button class="btn ghost ripple" id="prevBtn" aria-label="Назад">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>

      <button class="btn play ripple" id="playBtn" aria-label="Играть">
        <span class="icon-wrap">
          <svg class="icon-play"  viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </span>
      </button>

      <button class="btn ghost ripple" id="nextBtn" aria-label="Вперёд">
        <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg>
      </button>
    </nav>

    <!-- Доп. контролы -->
    <section class="extras">
      <div class="volume">
        <button class="btn tiny ripple" id="muteBtn" aria-label="Звук">
          <svg viewBox="0 0 24 24" id="volIcon">
            <path d="M3 9v6h4l5 5V4L7 9H3z"/>
          </svg>
        </button>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1"
               class="vol-range" aria-label="Громкость"/>
      </div>

      <button class="btn tiny ripple" id="loopBtn" aria-label="Повтор">
        <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </section>

    <!-- Хинт снизу -->
    <footer class="hint" id="hint">Space — пауза · ← → — громкость</footer>
  </main>

  <!-- ТОСТ -->
  <div class="toast" id="toast" role="status" aria-live="polite">
    <span class="toast-text" id="toastText"></span>
  </div>

  <!-- ПУЛЬСИРУЮЩЕЕ КОЛЬЦО ПРИ КЛИКЕ -->
  <div class="pulse-layer" id="pulseLayer" aria-hidden="true"></div>

  <audio id="audio" preload="metadata"></audio>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
